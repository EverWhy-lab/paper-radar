name: daily-run

on:
  schedule:
    # 12:30 Asia/Shanghai = 04:30 UTC. The later run leaves more margin for
    # the arXiv daily batch, network delay, and GitHub runner scheduling.
    # arXiv makes no
    # announcements Friday or Saturday evenings, so weekend runs may be empty.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Optional exact-day backfill (YYYY-MM-DD); leave empty for an incremental run
        required: false
        default: ""
        type: string
      discover_history:
        description: Also run OpenAlex historical discovery (requires the OPENALEX_API_KEY repository secret)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-radar-daily
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Daily reader run (with arXiv retries)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_DATE: ${{ inputs.date }}
        run: |
          # arXiv rate-limits shared runner IPs with transient 429 responses.
          # Four attempts wait at most 25 minutes total (5m, 10m, 10m),
          # comfortably below the 120-minute job timeout.
          command=(python -m paper_radar run)
          if [[ -n "$RUN_DATE" ]]; then
            command+=(--date "$RUN_DATE")
          fi
          bash scripts/retry-command.sh \
            --max-attempts 4 \
            --initial-delay-seconds 300 \
            --max-delay-seconds 600 \
            -- "${command[@]}"

      - name: Historical discovery (optional)
        if: ${{ inputs.discover_history }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "discover_history was requested but OPENALEX_API_KEY is not set as a repository secret; skipping."
            exit 0
          fi
          python -m paper_radar history discover

      - name: Commit updated data and site
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily reader run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
