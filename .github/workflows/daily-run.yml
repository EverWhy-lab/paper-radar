name: daily-run

on:
  schedule:
    # 09:30 Asia/Shanghai = 01:30 UTC. arXiv posts the previous evening's
    # batch at 20:00 US Eastern (08:00 in summer / 09:00 in winter in
    # Asia/Shanghai), so 09:30 catches it with margin. arXiv makes no
    # announcements Friday or Saturday evenings, so weekend runs may be empty.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Optional exact-day backfill (YYYY-MM-DD); leave empty for an incremental run
        required: false
        default: ""
        type: string
      discover_history:
        description: Also run OpenAlex historical discovery (requires the OPENALEX_API_KEY repository secret)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-radar-daily
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Offline tests
        run: python -m pytest -q

      - name: Daily reader run (with arXiv retries)
        run: |
          # arXiv rate-limits shared runner IPs with transient 429 responses.
          # Retry for up to about an hour with five-minute spacing so a
          # short-lived block clears before we give up.
          max_attempts=12
          wait_seconds=300
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "--- Attempt $attempt/$max_attempts at $(date -u +%H:%M:%SZ) ---"
            if [ -n "${{ inputs.date }}" ]; then
              python -m paper_radar run --date "${{ inputs.date }}"
            else
              python -m paper_radar run
            fi
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "Daily reader run succeeded on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Attempt $attempt failed with exit code $status; waiting ${wait_seconds}s before retry."
              sleep "$wait_seconds"
              wait_seconds=$((wait_seconds * 2))
            fi
            attempt=$((attempt + 1))
          done
          echo "Daily reader run failed after $max_attempts attempts."
          exit 1

      - name: Historical discovery (optional)
        if: ${{ inputs.discover_history }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "discover_history was requested but OPENALEX_API_KEY is not set as a repository secret; skipping."
            exit 0
          fi
          python -m paper_radar history discover

      - name: Commit updated data and site
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily reader run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
