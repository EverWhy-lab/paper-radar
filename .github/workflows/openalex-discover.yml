name: openalex-discover

on:
  schedule:
    # Weekly discovery: Monday 10:30 Asia/Shanghai (02:30 UTC)
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-radar-openalex-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Historical discovery
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "OPENALEX_API_KEY secret is not set; skipping historical discovery."
            exit 0
          fi
          python -m paper_radar history discover

      - name: Rising Papers discovery
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "OPENALEX_API_KEY secret is not set; skipping Rising Papers discovery."
            exit 0
          fi
          python -m paper_radar history rising

      - name: Commit updated discovery state
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly OpenAlex discovery $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
