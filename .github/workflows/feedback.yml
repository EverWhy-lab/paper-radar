name: feedback

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-feedback:
    if: "startsWith(github.event.issue.title, 'feedback:')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Read issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${{ github.event.issue.number }}" --json body -q .body > /tmp/feedback.txt

      - name: Apply feedback
        run: python -m paper_radar feedback apply /tmp/feedback.txt

      - name: Commit feedback state
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data/dismissals.json data/favorites.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: apply web feedback $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi

      - name: Close feedback issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "已处理：不相关与收藏反馈已记录。"
