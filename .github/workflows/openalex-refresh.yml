name: openalex-refresh

on:
  schedule:
    # Monthly pool refresh: 1st of month 10:30 Asia/Shanghai (02:30 UTC)
    - cron: "30 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-radar-openalex-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Historical pool refresh
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "OPENALEX_API_KEY secret is not set; skipping historical refresh."
            exit 0
          fi
          python -m paper_radar history refresh --all

      - name: Prune old candidate files
        run: python -m paper_radar candidates prune --older-than 30

      - name: Commit updated discovery pool
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly OpenAlex pool refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
