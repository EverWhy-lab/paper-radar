site:
  name: "Paper Radar"
  timezone: "Asia/Shanghai"
  github_repo: "EverWhy-lab/paper-radar"

fetch:
  endpoint: "https://export.arxiv.org/api/query"
  user_agent: "PaperRadar/0.2.4 (personal non-commercial research tool)"
  page_size: 100
  max_pages: 40
  page_delay_seconds: 5.0
  timeout_seconds: 30
  retries: 5
  lookback_days: 7

categories:
  cs.RO: 20
  cs.AI: 12
  cs.LG: 10
  eess.SY: 8

scoring:
  abstract_multiplier: 0.65
  core_topic_title_bonus: 8
  weak_keyword_multiplier: 0.45
  topics_require_robotics_context: true
  robotics_context:
    positive_terms:
      - robot
      - robots
      - robotic
      - robotics
      - manipulation
      - manipulator
      - manipulators
      - mobile manipulation
      - humanoid
      - whole-body manipulation
      - loco-manipulation
      - dexterous manipulation
      - robot policy
      - robot learning
      - visuomotor
      - vision-language-action
      - robot foundation model
      - embodied robot
      - tactile manipulation
      - sim-to-real
      - teleoperation
    negative_terms:
      - building energy
      - HVAC
      - microgrid
      - power system
      - power systems
      - smart grid
  topics:
    - id: vla_robot_foundation
      label: "VLA & Robot Foundation Models"
      weight: 24
      keywords:
        - vision-language-action
        - VLA
        - robot foundation model
        - robotics foundation model
        - embodied foundation model
        - generalist robot policy
        - general-purpose robot
        - language-conditioned manipulation
        - language-conditioned control
        - multimodal robot policy
        - action tokenizer
        - action expert
        - cross-embodiment policy
        - multi-embodiment
        - general-purpose manipulation
    - id: world_model_embodied_reasoning
      label: "World Models & Embodied Reasoning"
      weight: 22
      keywords:
        - robot world model
        - robotic world model
        - embodied world model
        - world model for robotics
        - world model for robot learning
        - world action model
        - video world model
        - action-conditioned prediction
        - future prediction for robots
        - model-based robot planning
        - embodied planning
        - embodied reasoning
        - physical reasoning
        - long-horizon manipulation
        - long-horizon planning
        - hierarchical robot planning
        - semantic robot planning
        - subgoal planning for robots
        - robot memory
        - embodied memory
        - task planning for robots
        - multimodal agent for robotics
    - id: humanoid_loco_manipulation
      label: "Humanoid & Whole-Body Loco-Manipulation"
      weight: 22
      keywords:
        - humanoid robot
        - humanoid robotics
        - humanoid locomotion
        - humanoid manipulation
        - humanoid whole-body control
        - loco-manipulation
        - locomotion and manipulation
        - whole-body manipulation
        - whole-body policy
        - whole-body imitation
        - whole-body reinforcement learning
        - biped robot
        - bipedal robot
        - mobile manipulation
        - mobile manipulator
        - bimanual humanoid
        - whole-body teleoperation
        - human motion prior
        - motion imitation
      weak_keywords:
        - quadruped robot
        - legged robot
    - id: robot_learning_posttraining
      label: "Robot Learning & Policy Post-Training"
      weight: 20
      keywords:
        - robot learning
        - imitation learning
        - behavior cloning
        - visuomotor policy
        - visuomotor control
        - action chunking
        - diffusion policy
        - action diffusion
        - flow matching policy
        - flow-based policy
        - generative robot policy
        - reinforcement fine-tuning
        - reinforcement learning post-training
        - VLA post-training
        - policy post-training
        - online reinforcement learning
        - offline-to-online RL
        - GRPO robotics
        - robot policy improvement
        - self-improving robot
        - robot self-improvement
        - learning from robot failures
        - test-time robot adaptation
        - lifelong robot learning
        - continual robot learning
        - continual VLA
        - lifelong VLA
        - robot skill acquisition
        - catastrophic forgetting robotics
    - id: dexterous_multimodal_manipulation
      label: "Dexterous & Multimodal Manipulation"
      weight: 20
      keywords:
        - dexterous manipulation
        - bimanual manipulation
        - contact-rich manipulation
        - forceful manipulation
        - manipulation force control
        - tactile manipulation
        - tactile-reactive manipulation
        - tactile policy
        - tactile foundation model
        - visuo-tactile
        - vision tactile
        - touch sensing for manipulation
        - contact sensing for manipulation
        - slip detection
        - deformable object manipulation
        - fine manipulation
        - in-hand manipulation
      weak_keywords:
        - dexterous hand
        - robot hand
        - robotic hand
        - robot tactile sensing
    - id: robot_data_scaling_sim2real
      label: "Robot Data Scaling & Sim-to-Real"
      weight: 20
      keywords:
        - robot data
        - robotics dataset
        - robot learning dataset
        - large-scale robot data
        - large-scale demonstrations
        - robot data scaling
        - scaling law for robotics
        - robot data mixture
        - cross-embodiment data
        - multi-embodiment data
        - robot teleoperation
        - human demonstration for robots
        - human video for robotics
        - egocentric video robotics
        - UMI
        - synthetic robot data
        - simulation data for robots
        - sim-to-real
        - sim2real
        - domain randomization
        - digital twin robotics
        - robot data engine
        - data flywheel for robotics
    - id: robot_control_optimization
      label: "Planning, Control & Estimation"
      weight: 12
      keywords:
        - motion planning
        - kinodynamic planning
        - sampling-based motion planning
        - trajectory planning
        - collision-free planning
        - contact planning
        - task and motion planning
        - TAMP
        - kinodynamic optimization
        - whole-body control
        - WBC
        - model predictive control
        - MPC
        - trajectory optimization
        - contact-implicit optimization
        - optimal control
        - nonlinear optimal control
        - differential dynamic programming
        - DDP
        - iterative LQR
        - iLQR
        - inverse dynamics
        - hierarchical quadratic programming
        - HQP
        - control barrier function
        - CBF
        - safety-critical control
        - robust MPC
        - tube MPC
        - chance-constrained control
        - robot dynamics
        - robot state estimation
        - invariant EKF
        - InEKF
        - factor graph
        - contact-aided state estimation
        - proprioceptive state estimation
  # Old persisted topic ids remain readable and retain feedback cooldown meaning.
  topic_aliases:
    legged_humanoid: humanoid_loco_manipulation
    mobile_manipulation: humanoid_loco_manipulation
    optimal_control: robot_control_optimization
    robot_learning: robot_learning_posttraining
    diffusion_visuomotor: robot_learning_posttraining
    vla_foundation: vla_robot_foundation
  legacy_topic_labels:
    llm_agent_robotics: "LLM / Agent Robotics (legacy)"
    pose_rescue: "Pose & Rescue Robotics (legacy)"
  exclusions:
    - term: autonomous driving
      penalty: 18
    - term: recommendation system
      penalty: 22
    - term: wireless communication
      penalty: 18
    - term: medical image segmentation
      penalty: 18
    - term: human pose estimation
      penalty: 22
    - term: keypoint detection
      penalty: 18
    - term: molecule generation
      penalty: 22

video_scoring:
  research_fit_factor: 0.25
  abstract_multiplier: 0.65
  signals:
    - label: "Physical robot demonstration"
      weight: 24
      keywords: [real-world robot, physical robot, hardware experiment, robot demonstration, real robot]
    - label: "Visually distinctive platform"
      weight: 20
      keywords: [quadruped, humanoid, legged robot, mobile manipulator, aerial manipulator]
    - label: "Dynamic task"
      weight: 18
      keywords: [locomotion, manipulation, parkour, whole-body, dexterous, navigation]
    - label: "Learning policy"
      weight: 14
      keywords: [policy learning, reinforcement learning, imitation learning, diffusion policy, visuomotor]
    - label: "Benchmark or comparison"
      weight: 10
      keywords: [benchmark, evaluation, outperform, comparison, ablation]

sections:
  highly_relevant_min_score: 50
  highly_relevant_min_count: 5
  highly_relevant_limit: 10
  expanded_min_score: 20
  expanded_min_count: 3
  expanded_limit: 5

recommendations:
  max_total: 5
  selection_order: [recent_new, important_update, reading_pool]
  recent_new:
    max_count: 3
    min_research_fit: 40
    min_core_topic_matches: 1
    min_non_generic_keyword_matches: 1
    cooldown_days: 14
    max_same_primary_topic: 1
    max_topic_overlap: 0.66
  reading_pool:
    max_count: 2
    default_priority: 50
    min_priority: 1
    cooldown_days: 14
    eligible_statuses: [unread, queued]
  important_update:
    max_count: 1
    min_research_fit: 60
    min_core_topic_matches: 1
    min_non_generic_keyword_matches: 1
    cooldown_days: 7
  core_topic_ids:
    - vla_robot_foundation
    - world_model_embodied_reasoning
    - humanoid_loco_manipulation
    - robot_learning_posttraining
    - dexterous_multimodal_manipulation
    - robot_data_scaling_sim2real
  generic_keywords:
    - quadruped robot
    - legged robot
    - robot learning
    - embodied foundation model
    - reinforcement learning
    - imitation learning
    - behavior cloning
    - online reinforcement learning
    - large language model
    - LLM
    - agent
    - agentic planning
    - robot planning
    - task planning
    - optimal control
    - sim-to-real
    - sim2real
    - dexterous hand
    - robot hand
    - robotic hand
    - robot tactile sensing
  excluded_terms:
    - autonomous cyber
    - cyber operations
    - evolutionary game
    - autonomous driving
    - autonomous vehicle
    - self-driving
    - traffic prediction
    - wireless communication
    - recommendation system
    - recommender system
    - power system
    - medical image
    - human pose estimation
    - keypoint detection
    - molecule generation
  # Recommendation-layer taxonomy. These phrases do not change research_fit;
  # they only make cross-day reading redundancy explainable.
  recommendation_subtopics:
    vla_posttraining:
      core_topics: [vla_robot_foundation, robot_learning_posttraining]
      terms: [VLA post-training, vision-language-action post-training, VLA finetuning, VLA fine-tuning]
    robot_world_model:
      core_topics: [world_model_embodied_reasoning]
      terms: [robot world model, world model for robot, embodied world model]
    world_action_model:
      core_topics: [world_model_embodied_reasoning]
      terms: [world action model, world-action model, action-conditioned world model]
    robot_data_scaling:
      core_topics: [robot_data_scaling_sim2real]
      terms: [robot data scaling, large-scale robot data, robot data mixture, robot data engine]
    cross_embodiment:
      core_topics: [robot_data_scaling_sim2real, vla_robot_foundation]
      terms: [cross-embodiment, cross embodiment, multi-embodiment, multi embodiment]
    sim_to_real:
      core_topics: [robot_data_scaling_sim2real]
      terms: [sim-to-real, sim2real, simulation to reality, domain randomization]
    humanoid_whole_body:
      core_topics: [humanoid_loco_manipulation]
      terms: [humanoid whole-body, humanoid whole body, whole-body humanoid, whole body humanoid]
    loco_manipulation:
      core_topics: [humanoid_loco_manipulation]
      terms: [loco-manipulation, loco manipulation, locomotion and manipulation]
    diffusion_flow_policy:
      core_topics: [robot_learning_posttraining, dexterous_multimodal_manipulation]
      terms: [diffusion policy, flow policy, flow matching policy, diffusion visuomotor]
    offline_to_online_rl:
      core_topics: [robot_learning_posttraining]
      terms: [offline-to-online, offline to online, offline RL to online, offline reinforcement learning to online]
    continual_robot_learning:
      core_topics: [robot_learning_posttraining]
      terms: [continual robot learning, lifelong robot learning, continual policy learning, failure learning]
    dexterous_manipulation:
      core_topics: [dexterous_multimodal_manipulation]
      terms: [dexterous manipulation, dexterous hand, in-hand manipulation, in hand manipulation]
    tactile_manipulation:
      core_topics: [dexterous_multimodal_manipulation]
      terms: [tactile manipulation, tactile sensing, visuotactile, vision-tactile]
    bimanual_manipulation:
      core_topics: [dexterous_multimodal_manipulation, humanoid_loco_manipulation]
      terms: [bimanual manipulation, bi-manual manipulation, dual-arm manipulation, dual arm manipulation]
    motion_planning:
      matched_topics: [robot_control_optimization]
      terms: [motion planning, sampling-based motion planning, trajectory planning, collision-free planning, contact planning, task and motion planning, TAMP]
    kinodynamic_planning:
      matched_topics: [robot_control_optimization]
      terms: [kinodynamic planning, kinodynamic motion planning, kinodynamic optimization]
    model_predictive_control:
      matched_topics: [robot_control_optimization]
      terms: [model predictive control, MPC, robust MPC, tube MPC]
    whole_body_control:
      matched_topics: [robot_control_optimization]
      terms: [whole-body control, whole body control, WBC, inverse dynamics control, inverse-dynamics control, whole-body inverse dynamics, hierarchical quadratic programming, HQP]
    trajectory_optimization:
      matched_topics: [robot_control_optimization]
      terms: [trajectory optimization, contact-implicit optimization, optimal control, nonlinear optimal control, differential dynamic programming, DDP, iterative LQR, iLQR]
    safety_critical_control:
      matched_topics: [robot_control_optimization]
      terms: [control barrier function, CBF, safety-critical control, robust MPC, tube MPC, chance-constrained control]
    robot_state_estimation:
      matched_topics: [robot_control_optimization]
      terms: [robot state estimation, invariant EKF, InEKF, factor graph, contact-aided state estimation, contact-aided invariant, proprioceptive state estimation, proprioceptive sensor fusion]
  document_types:
    survey_terms: [review, survey, tutorial, taxonomy, systematic overview]
    benchmark_terms: [benchmark, challenge, dataset evaluation]
  semantic_cooldown:
    frontier_hard_cooldown_days: 4
    frontier_window_days: 3
    frontier_penalty: 8
    extended_window_days: 7
    extended_penalty: 12
    survey_window_days: 30
    survey_recent_window_days: 14
    survey_recent_penalty: 18
    survey_late_penalty: 12
    secondary_topic_penalty_factor: 0.35
    lexical_window_days: 7
    lexical_similarity_threshold: 0.55
    lexical_penalty: 4
  personal_domain_affinity:
    preferred:
      adjustment: 6
      terms:
        - humanoid
        - whole-body manipulation
        - whole body manipulation
        - loco-manipulation
        - mobile manipulation
        - general-purpose manipulation
        - general purpose manipulation
        - quadruped
        - dexterous manipulation
        - bimanual manipulation
        - robot foundation model
    neutral:
      adjustment: 0
      terms: [navigation, manipulator, multi-robot, aerial robot, robot perception]
    peripheral:
      adjustment: -3
      terms:
        - surgical robot
        - medical robot
        - agricultural robot
        - underwater robot
        - warehouse robot
        - search and rescue
  # Kept for loading V0.1.2 recommendation archives and regression tests.
  # New daily pages use daily_mix below.
  daily_mix:
    max_total: 5
    max_recent_total: 3
    selection_order: [frontier_recent, journal_recent, model_based_recent, rising_recent, review_knowledge_map, high_impact_historical]
    journal_recent:
      max_count: 2
      min_research_fit: 35
      min_core_topic_matches: 1
      min_non_generic_keyword_matches: 1
      recency_days: 60
      cooldown_days: 14
      max_same_primary_topic: 1
      max_topic_overlap: 0.66
      min_recommendation_utility: 32
      eligible_statuses: [unread, queued]
    frontier_recent:
      max_count: 2
      min_research_fit: 40
      min_core_topic_matches: 1
      min_non_generic_keyword_matches: 1
      cooldown_days: 14
      max_same_primary_topic: 1
      max_topic_overlap: 0.66
      min_recommendation_utility: 36
      min_redundant_utility: 70
    model_based_recent:
      max_count: 1
      min_research_fit: 28
      min_journal_research_fit: 12
      journal_source_adjustment: 20
      max_age_days: 14
      cooldown_days: 14
      min_recommendation_utility: 32
      min_redundant_utility: 44
      eligible_statuses: [unread, queued]
      method_subtopics:
        - motion_planning
        - kinodynamic_planning
        - model_predictive_control
        - whole_body_control
        - trajectory_optimization
        - safety_critical_control
        - robot_state_estimation
    rising_recent:
      max_count: 1
      max_count_per_7_days: 2
      min_rising_score: 55
      min_research_fit: 12
      max_age_days: 540
      cooldown_days: 45
      min_recommendation_utility: 55
      min_redundant_utility: 65
      eligible_statuses: [unread, queued]
    high_impact_historical:
      max_count: 1
      min_historical_value_score: 42
      cooldown_days: 45
      eligible_statuses: [unread, queued]
      max_same_primary_topic: 1
      max_topic_overlap: 0.66
      min_recommendation_utility: 36
      min_redundant_utility: 70
    review_knowledge_map:
      max_count: 1
      min_historical_value_score: 50
      cooldown_days: 45
      eligible_statuses: [unread, queued]
      document_signals: [review, survey, tutorial, taxonomy, benchmark]
      min_recommendation_utility: 70
      min_redundant_utility: 70

