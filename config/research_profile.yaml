site:
  name: "Paper Radar"
  timezone: "Asia/Shanghai"
  github_repo: "EverWhy-lab/paper-radar"

fetch:
  endpoint: "https://export.arxiv.org/api/query"
  user_agent: "PaperRadar/0.2.0 (personal non-commercial research tool)"
  page_size: 100
  max_pages: 40
  page_delay_seconds: 5.0
  timeout_seconds: 30
  retries: 5
  lookback_days: 7

categories:
  cs.RO: 20
  eess.SY: 12
  cs.AI: 8
  cs.LG: 8

scoring:
  abstract_multiplier: 0.65
  topics:
    - id: legged_humanoid
      label: "Legged & Humanoid"
      weight: 20
      keywords:
        - quadruped robot
        - quadruped robots
        - quadrupedal robot
        - legged robot
        - legged robots
        - legged locomotion
        - humanoid robot
        - humanoid robots
        - humanoid locomotion
        - bipedal robot
    - id: mobile_manipulation
      label: "Mobile Manipulation"
      weight: 20
      keywords:
        - mobile manipulation
        - locomotion and manipulation
        - loco-manipulation
        - loco manipulation
        - whole-body manipulation
    - id: optimal_control
      label: "WBC / MPC / Optimization"
      weight: 18
      keywords:
        - whole-body control
        - whole body control
        - WBC
        - model predictive control
        - MPC
        - trajectory optimization
        - optimal control
    - id: robot_learning
      label: "Robot Learning"
      weight: 16
      keywords:
        - robot learning
        - reinforcement learning
        - imitation learning
        - behavior cloning
        - sim-to-real
    - id: diffusion_visuomotor
      label: "Diffusion & Visuomotor Policy"
      weight: 17
      keywords:
        - diffusion policy
        - diffusion model
        - visuomotor policy
        - visuomotor control
        - action diffusion
    - id: vla_foundation
      label: "VLA & Foundation Models"
      weight: 17
      keywords:
        - vision-language-action
        - vision language action
        - VLA
        - robot foundation model
        - robotics foundation model
        - embodied foundation model
        - embodied agent
    - id: llm_agent_robotics
      label: "LLM / Agent Robotics"
      weight: 14
      keywords:
        - large language model
        - LLM
        - agentic planning
        - robot planning
        - task planning
        - language-conditioned control
    - id: pose_rescue
      label: "Pose & Rescue Robotics"
      weight: 14
      keywords:
        - human pose estimation
        - keypoint detection
        - pose estimation
        - rescue robot
        - rescue robotics
        - search and rescue
  exclusions:
    - term: autonomous driving
      penalty: 18
    - term: recommendation system
      penalty: 22
    - term: wireless communication
      penalty: 18
    - term: medical image segmentation
      penalty: 18
    - term: molecule generation
      penalty: 22

video_scoring:
  research_fit_factor: 0.25
  abstract_multiplier: 0.65
  signals:
    - label: "Physical robot demonstration"
      weight: 24
      keywords: [real-world robot, physical robot, hardware experiment, robot demonstration, real robot]
    - label: "Visually distinctive platform"
      weight: 20
      keywords: [quadruped, humanoid, legged robot, mobile manipulator, aerial manipulator]
    - label: "Dynamic task"
      weight: 18
      keywords: [locomotion, manipulation, parkour, whole-body, dexterous, navigation]
    - label: "Learning policy"
      weight: 14
      keywords: [policy learning, reinforcement learning, imitation learning, diffusion policy, visuomotor]
    - label: "Benchmark or comparison"
      weight: 10
      keywords: [benchmark, evaluation, outperform, comparison, ablation]

sections:
  highly_relevant_min_score: 50
  highly_relevant_min_count: 5
  highly_relevant_limit: 10
  expanded_min_score: 20
  expanded_min_count: 3
  expanded_limit: 5

recommendations:
  max_total: 5
  selection_order: [recent_new, important_update, reading_pool]
  recent_new:
    max_count: 3
    min_research_fit: 40
    min_core_topic_matches: 1
    min_non_generic_keyword_matches: 1
    cooldown_days: 14
    max_same_primary_topic: 1
    max_topic_overlap: 0.66
  reading_pool:
    max_count: 2
    default_priority: 50
    min_priority: 1
    cooldown_days: 14
    eligible_statuses: [unread, queued]
  important_update:
    max_count: 1
    min_research_fit: 60
    min_core_topic_matches: 1
    min_non_generic_keyword_matches: 1
    cooldown_days: 7
  core_topic_ids:
    - legged_humanoid
    - mobile_manipulation
    - optimal_control
    - robot_learning
    - diffusion_visuomotor
    - vla_foundation
    - llm_agent_robotics
  generic_keywords:
    - robot learning
    - reinforcement learning
    - imitation learning
    - behavior cloning
    - large language model
    - LLM
    - agentic planning
    - robot planning
    - task planning
    - optimal control
  excluded_terms:
    - autonomous cyber
    - cyber operations
    - evolutionary game
    - autonomous driving
    - traffic prediction
    - wireless communication
    - recommendation system
    - medical image
    - molecule generation
  # Kept for loading V0.1.2 recommendation archives and regression tests.
  # New daily pages use daily_mix below.
  daily_mix:
    max_total: 5
    selection_order: [journal_recent, review_knowledge_map, high_impact_historical, frontier_recent]
    journal_recent:
      max_count: 2
      min_research_fit: 40
      min_core_topic_matches: 1
      min_non_generic_keyword_matches: 1
      recency_days: 60
      cooldown_days: 14
      max_same_primary_topic: 1
      max_topic_overlap: 0.66
      eligible_statuses: [unread, queued]
    frontier_recent:
      max_count: 2
      min_research_fit: 40
      min_core_topic_matches: 1
      min_non_generic_keyword_matches: 1
      cooldown_days: 14
      max_same_primary_topic: 1
      max_topic_overlap: 0.66
    high_impact_historical:
      max_count: 3
      min_historical_value_score: 42
      cooldown_days: 45
      eligible_statuses: [unread, queued]
      max_same_primary_topic: 1
      max_topic_overlap: 0.66
    review_knowledge_map:
      max_count: 1
      min_historical_value_score: 50
      cooldown_days: 45
      eligible_statuses: [unread, queued]
      document_signals: [review, survey, tutorial, taxonomy, benchmark]

openalex:
  endpoint: "https://api.openalex.org"
  user_agent: "PaperRadar/0.2.0 (personal non-commercial research tool)"
  timeout_seconds: 30
  retries: 3
  retry_delay_seconds: 1.0
  cache_ttl_days: 30
  daily_request_budget: 150
  default_per_page: 20

historical_discovery:
  publication_year_min: 2000
  publication_year_max: 2026
  expansion_depth: 1
  per_query_limit: 10
  per_seed_limit: 20
  global_candidate_limit: 200
  default_cli_limit: 100
  topic_queries:
    - mobile manipulation
    - quadrupedal and legged robots
    - robot manipulation
    - humanoid locomotion and manipulation
    - model predictive control in robotics
    - whole-body control robotics
    - robot state estimation
    - robot learning
    - embodied intelligence robotics
    - robot foundation models
    - sim-to-real robotics
  knowledge_map_queries:
    - mobile manipulation survey review tutorial
    - legged robot locomotion survey review benchmark
    - whole-body control robotics survey tutorial
    - robot learning survey taxonomy benchmark
    - embodied robotics foundation models survey review
  seed_expansion_sources: [referenced_works, citing_works, related_works]

journals:
  recency_days: 60
  per_journal_limit: 15
  sources:
    - name: "IEEE Transactions on Automatic Control"
      source_id: "S184954342"
    - name: "Automatica"
      source_id: "S51360982"
    - name: "IEEE Transactions on Industrial Electronics"
      source_id: "S58031724"
    - name: "IEEE Transactions on Control Systems Technology"
      source_id: "S133363738"
    - name: "IEEE Transactions on Industrial Informatics"
      source_id: "S184777250"
    - name: "Control Engineering Practice"
      source_id: "S105928092"
    - name: "Journal of Process Control"
      source_id: "S96000363"

historical_scoring:
  min_research_fit: 18
  min_core_topic_matches: 1
  min_non_generic_keyword_matches: 1
  minimum_metadata_coverage_factor: 0.78
  recent_growth_years: 2
  prior_growth_years: 2
  annual_citation_reference: 20
  fwci_reference: 3.0
  independent_seed_reference: 3
  review_terms: [review, survey, tutorial, taxonomy, benchmark]
  method_terms: [method, framework, system, policy, controller, architecture]
  weights:
    research_relevance: 35
    normalized_citation: 20
    fwci: 10
    citation_momentum: 10
    seed_provenance: 10
    work_signal: 5
    metadata_completeness: 10

llm_analysis:
  enabled: true
  provider: deepseek
  endpoint: "https://api.deepseek.com/chat/completions"
  model: "deepseek-chat"
  timeout_seconds: 60
  retries: 3
  retry_delay_seconds: 3.0
  max_tokens: 1500
  language: "en"

dismissals:
  topic_cooldown_window_days: 30
  min_dismissals_for_topic_cooldown: 2
  topic_cooldown_days: 14
