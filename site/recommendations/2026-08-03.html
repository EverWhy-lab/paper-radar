<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A personal daily shortlist of robotics papers selected by transparent rules.">
  <title>Paper Radar — 2026-08-03</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/reader.css">
</head>
<body data-repo="lpredoomy/paper-radar">
  <header class="site-header">
    <div class="shell header-row">
      <div>
        <h1>Paper Radar</h1>
      </div>
      <div class="date-block">
        <span>Recommendation date</span>
        <strong>2026-08-03</strong>
        <small>Updated 2026-08-03 23:45 Asia/Shanghai</small>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="daily-summary">
      <div><strong>0</strong><span>today's recommendations</span></div>
    </section>

    <div class="navigation-row">
      <details class="archive-menu">
        <summary>历史推荐归档</summary>
        <nav><a href="2026-08-04.html">2026-08-04</a><a href="2026-08-03.html">2026-08-03</a></nav>
      </details>
    </div>

    <section class="empty-state">
      <h2>今日没有发现足够值得推荐的论文。</h2>
    </section>
  </main>
  <script>
    (function () {
      var repo = document.body.getAttribute("data-repo") || "";
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".dismiss-button"));
      function markedIds() {
        try { return JSON.parse(localStorage.getItem("paper-radar-dismissed") || "[]"); } catch (e) { return []; }
      }
      function markFilled(button) {
        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");
      }
      markedIds().forEach(function (id) {
        buttons.forEach(function (button) {
          if (button.getAttribute("data-paper-id") === id) { markFilled(button); }
        });
      });
      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          if (button.classList.contains("active")) { return; }
          var id = button.getAttribute("data-paper-id");
          var title = button.getAttribute("data-title") || "";
          markFilled(button);
          var seen = markedIds();
          if (seen.indexOf(id) === -1) {
            seen.push(id);
            localStorage.setItem("paper-radar-dismissed", JSON.stringify(seen));
          }
          if (repo) {
            var url = "https://github.com/" + repo + "/issues/new?title=" +
              encodeURIComponent("feedback: not-interested " + id) +
              "&body=" + encodeURIComponent("Paper: " + title + "\n\nThis issue is created automatically by the paper page. Submitting it permanently excludes this paper and temporarily reduces papers sharing its primary topic.");
            window.open(url, "_blank", "noopener");
          }
        });
      });
    })();
  </script>
</body>
</html>
